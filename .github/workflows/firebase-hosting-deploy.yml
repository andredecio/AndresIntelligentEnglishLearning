name: Deploy to Firebase Hosting on Merge

on:
  push:
    branches:
      - main

jobs:
  deploy_to_hosting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Checks out your repository files

      # Deploys raw static public files directly to Firebase Hosting
      - name: Deploy to Firebase Hosting Live
        run: npx firebase-tools deploy --only hosting --project enduring-victor-460703-a2 --token "${{ secrets.FIREBASE_TOKEN }}"
